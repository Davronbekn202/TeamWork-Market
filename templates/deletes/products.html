{% extends 'main.html' %}
{% block title %}
<title>Product delete</title>
{% endblock %}
{% block content %}
<h1>Delete Product</h1>

<p>Are you sure you want to delete this car? <strong>This action cannot be undone.</strong></p>
<form method="post">
    {% csrf_token %}
    <div class="delete-actions">
        <a href="javascript:history.back()">Cancel</a>
        <button type="submit">Yes, Delete</button>
    </div>
</form>
